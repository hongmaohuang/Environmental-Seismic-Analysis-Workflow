# This configure file includes most necessary parameters for running the MSNoise dv/v calculation workflow.
# However, there're still many minor parameters are not included and can make difference in the result.
# I would suggest users to read the MSNoise documentation and see if you can put the parameters you desire in the section, named "[dvv_calculation.msnoise.extra_msnoise_config]"
# You are welcome to have suggestions for improvments, please feel free to reach out or submit a pull request.
# Thank you!
# HM, 2026

### WORKFLOW ###
[workflow]

active_stage = "dvv_calculation"
# Choose one or more workflow stages, separated by commas:
# dvv_calculation, pressure_modeling, synthetic_dvv_mapping, correlation_analysis.

### MSNOISE DV/V CALCULATION ###
[dvv_calculation.msnoise]

run_commands = true
# false means only list configured commands.
# true means actually call the MSNoise commands below.

prepare_project = true
# true means this runner will download waveform data, initialize msnoise.sqlite,
# scan SDS files, and write station/filter/config entries before MSNoise commands.
# false means the fixed MSNoise project folder already contains a prepared project.
reset_project_dir = true
# Only used when prepare_project is true.
# true deletes the fixed MSNoise project folder before rebuilding it.

clear_jobs_on_run = true
# true clears existing MSNoise jobs before recreating them.
# This makes reruns safe after changing the time range or reference window.

skip_existing_downloads = true
# true reuses existing hourly raw_mseed chunks instead of downloading them again.

commands = [
  ["msnoise", "new_jobs", "--init"],
  ["msnoise", "reset", "--all", "CC"],
  ["msnoise", "compute_cc"],
  ["msnoise", "reset", "--all", "STACK"],
  ["msnoise", "stack", "-r"],
  ["msnoise", "reset", "STACK"],
  ["msnoise", "stack", "-m"],
  ["msnoise", "reset", "--all", "MWCS"],
  ["msnoise", "compute_mwcs"],
  ["msnoise", "reset", "--all", "DTT"],
  ["msnoise", "compute_dtt"],
]
# Command sequence for a full MSNoise dv/v calculation.
# You can shorten or reorder this list when restarting from an intermediate step.

data_type = "D"
# MSNoise data_type config value for daily SDS waveform files. D stands for "day".
# It means each file contains one day of data in SDS

geographic_bounds = { minlatitude = 63.8023, maxlatitude = 63.8968, minlongitude = -22.4933, maxlongitude = -22.3377}
# User-facing station search area used when prepare_project is true.
# The runner discovers matching stations from the FDSN station service.

channels = "*Z"
# Default FDSN channel selector used when prepare_project is true.
# You can use "BHZ,HHZ", "BH?,HH?", "*Z" or similar to specify multiple channels.
# If you are using DAS datasets, you should look up the channel code.

location = "*"
# FDSN location selector used when prepare_project is true.
# Use comma-separated location codes such as "00,10,60", or "*" for all locations.

split_locations_as_stations = false
# true maps location-specific channels to separate MSNoise station aliases.
# For example, ANTO maps location 00/10/60 to ANT00/ANT10/ANT60.

max_channels = 0
# Optional limit after automatic provider/routing discovery.
# 0 means no limit.

min_sample_rate = 0
# Optional channel sample-rate filter in Hz after discovery.
# 0 means no filter.


start_date = "2021-03-01T00:00:00"
# Waveform download start time used when prepare_project is true.

end_date = "2022-01-01T00:00:00"
# Waveform download end time used when prepare_project is true.

download_chunk_hours = 1
# Waveform download chunk length in hours.

download_timeout = 120
# Curl timeout in seconds for each waveform request.

curl_retries = 5
# Curl retry count for each waveform request.

curl_retry_delay = 5
# Seconds to wait between curl retries.

waveform_download_attempts = 3
# Number of full download-and-ObsPy-read attempts for each waveform chunk.
# This catches cases where curl returns HTTP 200 but the miniSEED payload is corrupt.

no_data_behavior = "skip"
# Behavior when FDSN returns HTTP 204 for a requested waveform chunk.
# Choose "skip" to print a warning and continue, or "fail" to stop immediately.

bad_waveform_behavior = "skip"
# Behavior when a downloaded waveform cannot be read by ObsPy after all attempts.
# Choose "skip" to continue with a gap, or "fail" to stop immediately.

msnoise_startdate = ""
msnoise_enddate = ""
# Optional MSNoise processing start/end dates.
# Leave blank to derive them from start_date/end_date.

ref_begin = "2021-05-01"
ref_end = "2021-05-14"
# Optional reference stack begin/end dates.
# Leave blank to use the MSNoise processing date range.
# Please note that MSNoise only except YYYY-MM-DD format for ref_begin/ref_end, so the time portion is ignored and the reference period always starts at 00:00:00.

autocorr = "N"
# Required for single-station runs discovered from a small geographic area.

components_to_compute = "ZZ"
# Cross-station components to compute.
# If you are using DAS datasets, you should look up the channel code.

components_to_compute_single_station = "ZZ"
# Single-station components to compute.
# If you are using DAS datasets, you should look up the channel code.

mov_stack = "1"
# Moving stack length in days.
# MSNoise (2025) now only supports one-day moving stacks, so this should be set to 1.
# In other words, your dt/t (dv/v) results will be daily no matter what you set up for analysis_duration and corr_duration

analysis_duration = "3600"
# MSNoise analysis duration in seconds.
# This is only for seperate chuncks of jobs for MSNoise
# 86400 means you are doing one day per job, 3600 means you are doing one hour per job, and so on.
# If you're interested in making hourly dv/v time series, you should set this and corr_duration to 3600.

corr_duration = "3600"
# Correlation window duration in seconds.
# 3600 means you are calculating dv/v values for one-hour correlation windows, 86400 means one-day correlation windows, and so on.
# It doesn't mean you will have hourly results if you set this to 3600, because the actual output cadence also depends on mov_stack and the time range of your data.

cc_sampling_rate = "20.0"
# MSNoise target sampling rate for cross-correlation.
# It will downsample the raw waveforms to this sampling rate before correlation.

whitening = "A"
# MSNoise spectral whitening mode.
# Choose "A" to apply spectral whitening to all data, or "N" for no spectral whitening.

stack_method = "pws"
# MSNoise stack method. You can use linear or pws.

dtt_lag = "static"
# DTT lag mode. Use "static" for a fixed coda window or "dynamic" for velocity-based lags.

dtt_v = "1.5"
# Apparent velocity used by dynamic DTT lag selection.
# If you already have a good estimate of the velocity structure, you can set this to a more specific value.
# If not, I would suggest you to use "static" for dtt_lag and take a look at the CCF and to see which part of CCF you want for your velocity estimate

dtt_width = "30.0"
# DTT coda window width in seconds.
# If you choose to use "static", this is the fixed window width starting at dtt_lag.

dtt_sides = "both"
# Coda side used for DTT regression.
# Which side you want to use for your velocity estimate

dtt_minlag = "5.0"
# Minimum DTT coda lag in seconds.
# The starting point you want for your velocity estimate window

dtt_mincoh = "0.7"
# Minimum MWCS coherence used in dt/t regression.
# The threshold for dt/t regression based on the coherence.

dtt_maxerr = "2.0"
# Maximum MWCS error used in dt/t regression.
# Set up a threshold to remove the results with high MWCS estimated error 

dtt_maxdt = "2.0"
# Maximum dt value used in dt/t regression.
# Set up a threshold to remove the results with large dt values

validate_outputs = true
# true means check expected MSNoise products after commands finish.

require_ref = true
# true means fail if REF stacks are missing.

require_mwcs = true
# true means fail if MWCS files are missing.

require_dtt = true
# true means fail if DTT files are missing.

### MSNOISE FILTER CONFIGURATION ###
[[dvv_calculation.msnoise.filters]]
ref = 1
# Filter 01.
low = 1
# Lower frequency for correlation filtering.
mwcs_low = 1
# Lower frequency for MWCS.
high = 5
# Upper frequency for correlation filtering.
mwcs_high = 5
# Upper frequency for MWCS.
rms_threshold = 0.0
# RMS threshold used by MSNoise filter config.
mwcs_wlen = 15.0
# MWCS moving window length in seconds.
mwcs_step = 4.0
# MWCS moving window step in seconds.

[dvv_calculation.msnoise.extra_msnoise_config]
# Optional raw MSNoise config overrides.
# Add entries here only when a MSNoise key is not already exposed in this configure file.

### PRESSURE MODELING CONFIGURATION ###

[pressure_modeling]
enabled = true

groundwater_csv_path = "inputs/02-pressure-modeling/groundwater.csv"
# Standardized groundwater input.
# Required columns: time, temperature, groundwater level [m a.s.l.].

atmospheric_pressure_csv_path = "inputs/02-pressure-modeling/atmospheric_pressure.csv"
# Standardized atmospheric-pressure input.
# Required columns: time, atmosphere pressure.
# atmosphere pressure must be in Pa.

snow_csv_path = "inputs/02-pressure-modeling/snow.csv"
# Standardized snow input.
# Required columns: time, snow depth.
# Optional column: snow cover.
# Snow loading is always included in the pressure-modeling stage.

external_pressure_loading_csv_path = ""
# Optional external pressure-loading input for the pore-pressure model.
# Required columns when configured: time, <driver>_loading_pa.
# Values must already be surface load or pressure in Pa. Do not put GFZ
# displacement predictors such as duV, duNS, or duEW here.

resample_rule = "1D"
# Sampling rate of the final result.
# If source data are coarser than this final grid, the runner warns and interpolates.
# The pressure-modeling time window follows dvv_calculation.msnoise.start_date and end_date.

depths_m = [0, 0.5, 1, 3, 5, 10]
# Depths where pore-pressure responses are calculated.

rho_w = 1000.0
gravity = 9.8
# Used for rho * g * h groundwater and snow load calculations.
# This was noted in the standalone script as calculateing rho*g*h.

skempton_b = 0.8
undrained_poisson_ratio = 0.25
# alpha = B(1 + nu_u) / 3(1 - nu_u), an elastic constant linked to
# Skempton's coefficient B and undrained Poisson ratio nu_u
# (Roeloffs, 1988; Rivet et al., 2015).

hydraulic_diffusivity_m2_s = 0.1
# c in the pore-pressure diffusion equation.

snow_density_kg_m3 = 300.0
# The standardized "snow depth" column is snow thickness, not SWE.
# This density converts snow depth to an approximate surface load.

poisson_ratio = 0.25
# Regular Poisson ratio for thermoelastic modeling.
# Kept separate from undrained_poisson_ratio because the two branches use different elastic assumptions.

youngs_modulus_pa = 3.0e10
# Thermoelastic branch uses Young's modulus as the primary elastic input.
# It is converted to shear modulus. Tests with 1e10, 2e10, and 3e10 did not
# strongly change the result; fractured areas may justify lower values.

m_over_mu_ratio = -5000.0
# Second Murnaghan constant divided by shear modulus.
# This avoids defining the Murnaghan constant directly and controls how
# strongly strain affects dv/v. A plausible tested range is roughly -100 to
# -10000: -100 gives smaller amplitudes, -10000 gives larger amplitudes.

horizontal_wavenumber_m_inv = 0.0006283185307179586
# Wavenumber as a proxy for the spatial resolution of temperature loading.
# This is 2*pi/r with r in meters; smaller wavenumber means longer wavelength
# and weaker temperature response.
# An easier way to think about this parameter is that it controls how much the temperature signal is smoothed out in space before it generates a dv/v response.
# so you can think about how large the area or how long the distance that the temperature signal can affect.

thermoelastic_spatial_factor = 1.0
# Tsai (2011) equation 17 contains sin(kx).
# Tsai's Figure 3 comparison evaluates the model at the horizontal position where the signal is largest.
# Setting this value to 1.0 means sin(kx)=1, i.e. the maximum-amplitude thermoelastic VSV dv/v response.

thermal_expansion_coeff_c_inv = 1.0e-5
thermal_diffusivity_m2_s = 1.0e-6
incompetent_layer_thickness_m = 10.4
# Tsai-style thermoelastic response parameters.
# Thermoelastic dv/v is evaluated at every depth in depths_m.

validate_outputs = true
# true validates that the CSV exists and contains modeled pressure columns.

min_output_rows = 1
# Minimum number of rows required in the pressure-modeling output.


[synthetic_dvv_mapping]
drivers = ["gwl", "atm", "snow", "thermoelastic", "ntal_cf", "ntol_cf", "hydl_cf"]
# Predictor families from outputs/02-pressure-modeling/pore_pressure_output.csv
# and optional external predictor CSVs.
# Paths are fixed in the stage runner; active_stage controls whether this stage runs.
# Supported aliases include atmospheric -> atm and temperature -> thermoelastic.

external_predictor_paths = [
  "inputs/03-loading-predictors/loading_input_demo.csv",
]
# Optional src/03-only predictor CSVs. Required column: datetime.
# Current GFZ loading predictors are displacement/gravity terms, not pressure:
# duEW/duNS/duV are meters, hydl_cf_dg is 1e-8 m/s2.

lags_days = [0, 1, 3, 7, 14, 30]
# Predictor lag grid. A 7-day lag means predictor(t - 7 days) is used for dv/v(t).

observed_pair = "ALL"
# For merged dv/v CSV files, use the ALL row if available.
# For raw MSNoise DTT files, ALL means median over non-autocorrelation pairs if no ALL row exists.

observed_component = "ZZ"
observed_filters = []
# Empty observed_filters means use every available filter.

fit_intercept = true
fit_trend = true
regularization_alpha = 1.0
# Ridge penalty applied to mapping weights. Intercept and trend are not penalized.

train_fraction = 0.7
min_samples = 20
# Chronological train/validation split and minimum overlapping samples per observed series.


[correlation_analysis]
enabled = false
# Placeholder for the observed-vs-modeled dv/v correlation stage.
